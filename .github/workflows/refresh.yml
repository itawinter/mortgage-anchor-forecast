name: Refresh curve

# Pulls the Bank of Israel tables, rebuilds curve.json, bakes the same curve
# into the page's built-in defaults, and commits both. GitHub Pages redeploys on
# that commit, so the page picks the new curve up on the next load with no
# rebuild and no manual step.
#
# BOTH, always. The page fetches curve.json but paints its baked copy first, so
# the two have to move together or every load opens on the older one.
#
# CADENCE. The two zero-coupon tables publish TWICE A MONTH (the release
# calendar is in the page). A nightly run is therefore already faster than the
# data changes; anything more frequent just re-reads the same numbers.

on:
  schedule:
    - cron: "0 4 * * 1-5"        # 04:00 UTC = 07:00 Israel (06:00 in winter)
  workflow_dispatch:              # and on demand from the Actions tab

permissions:
  contents: write                 # to commit the refreshed curve.json and page

concurrency:
  group: refresh-curve
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SheetJS
        run: npm install --no-audit --no-fund

      # Every source, URL and field name lives in data/sources.json — one place,
      # read by this job and by `npm run refresh` alike, so a URL that moves is
      # fixed once. All three were verified live on 2026-08-01.
      #
      # If a source does not parse, refresh-curve.mjs exits non-zero and nothing
      # is committed. The exception is the Makam leg, which declares a fallback
      # to the committed snapshot: it comes from an API behind a WAF that may
      # well refuse a CI runner, and a stale short end beats a dead job. Watch
      # the log for "falling back" — that is the signal the live pull stopped
      # working, and it will not fail the run.
      - name: Pull the curves
        run: |
          set -euo pipefail
          node tools/refresh-curve.mjs --config data/sources.json --out curve.next.json --verbose

      # A partial success is the dangerous case: if only one leg parsed, the file
      # would be written and would drop a curve the page needs. Check before
      # letting it anywhere near main.
      - name: Sanity-check the result before committing
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const c = JSON.parse(fs.readFileSync("curve.next.json", "utf8"));
            const fail = m => { console.error("REJECTED: " + m); process.exit(1); };
            if (!Array.isArray(c.nominal) || c.nominal.length < 10)
              fail(`nominal leg has ${c.nominal?.length ?? 0} points, expected 10+`);
            if (!Array.isArray(c.real) || c.real.length < 5)
              fail(`real leg has ${c.real?.length ?? 0} points, expected 5+`);
            const t = c.nominal.map(p => p[0]);
            if (Math.min(...t) > 0.3) fail("no short end: nominal starts at " + Math.min(...t) + "y");
            if (Math.max(...t) < 10)  fail("no long end: nominal ends at " + Math.max(...t) + "y");
            const rates = [...c.nominal, ...c.real].map(p => p[1]);
            if (rates.some(r => !Number.isFinite(r) || r < -5 || r > 25))
              fail("a rate is outside -5..25%, so a column was probably misread");
            console.log(`ok  nominal ${c.nominal.length} pts, real ${c.real.length} pts, asOf ${c.asOf}`);
          '
          mv curve.next.json curve.json

      # The page carries a BAKED copy of the curve so it works with no network,
      # and it paints that copy before the curve.json fetch lands. Refreshing
      # curve.json alone therefore leaves the page opening on the previous
      # curve for a beat on every single load — and, because nothing else ever
      # rewrites the baked copy, drifting further behind with every run.
      #
      # This injects the file that just passed the check above, rather than
      # re-running the pull with --inject: a second fetch could return a
      # different curve from the one that was validated, and the page and
      # curve.json would then disagree with nothing to catch it. Importing the
      # tool is side-effect free — it guards its own entrypoint.
      - name: Bake the validated curve into the page
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            import { injectIntoHtml } from "./tools/refresh-curve.mjs";
            const curve = JSON.parse(fs.readFileSync("curve.json", "utf8"));
            const { html, changed } = injectIntoHtml(fs.readFileSync("index.html", "utf8"), curve);
            if (!changed.length) { console.error("REJECTED: nothing was injected"); process.exit(1); }
            fs.writeFileSync("index.html", html);
            console.log("baked into index.html: " + changed.join(", "));
          '

      - name: Commit if the curve moved
        run: |
          set -euo pipefail
          if git diff --quiet -- curve.json index.html; then
            echo "curve unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curve.json index.html
          git commit -m "curve: refresh from Bank of Israel ($(date -u +%Y-%m-%d))"
          git push
